
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeCare Hospital - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4fafa;
            color: #333;
        }

        header {
            background: #087f8c;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #b9f3ec;
        }

        .hero {
            text-align: center;
            padding: 140px 20px;
            background: linear-gradient(135deg, #d9f5f2, #a4dfe3);
        }

        .hero h1 {
            color: #087f8c;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #087f8c;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            background: #064b52;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            nav {
                text-align: center;
                line-height: 2;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>LifeCare Hospital</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="doctors.html">Doctors</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Your Health, Our Priority</h1>
    <p>Quality healthcare for you and your family.</p>
    <a href="contact.html" class="btn">Contact Us</a>
</section>

<footer>
    <p>&copy; 2026 LifeCare Hospital. All Rights Reserved.</p>
</footer>

</body>
</html>
